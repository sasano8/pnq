INHERIT: ./common/mkdocs_base.yml

site_name: PNQ
site_description: PNQ is a Python implementation like Language Integrated Query (LINQ).
site_url: https://github.com/sasano8/pnq/

repo_name: sasano8/pnq
repo_url: https://github.com/sasano8/pnq

nav:
  - はじめに: "index.md"
  - 入門: "quick_start.md"
  - インターフェース: "api.md"
  - クラス: "class.md"
  - データソース: "datasource.md"
  - 例外クラス: "exceptions.md"
  - 高度な使用方法: "advanced_usage.md"
  - 性能: "performance.md"
  - 内部設計: "design.md"
markdown_extensions:
  - admonition
  - codehilite:
      css_class: highlight
  - mkautodoc
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - overrides/css/custom.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - overrides/js/mermaid-init.js
