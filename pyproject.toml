[project]
name = "pnq"
version = "0.0.21"
description = ""
authors = [{ name = "sasano8", email = "y-sasahara@ys-method.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8.1"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering",
  "Framework :: AsyncIO",
]
dependencies = []

[project.urls]
Repository = "https://github.com/sasano8/pnq"

[dependency-groups]
dev = [
  "Jinja2>=3.1.2,<4.0.0",
  "unasync>=0.5.0,<0.6.0",
  # HTTPやDocker API を叩くときに使用（必須ではない）
  "requests>=2.28.1,<3.0.0",
  "requests-unixsocket2>=0.4.2",
]
test = [
  "pre-commit>=2.20,<4.0",
  "pytest>=7.1.2,<8.0.0",
  "pytest-cov>=3.0.0,<4.0.0",
  "black>=24.8.0,<24.10.0",
  "flake8>=5.0.3,<6.0.0",
  "mypy>=0.971,<0.972",
  "isort>=5.10.1,<6.0.0",
  "pyyaml>=6.0.1,<7.0.0",
]
docs = [
  "mkdocs>=1.3.1,<2.0.0",
  "mkautodoc>=0.2.0,<0.3.0",
  "mkdocs-material>=8.3.9,<9.0.0",
  "pymdown-extensions>=9.5,<10.0.0",
  "mkdocs-print-site-plugin>=2.3.4,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pnq"]

[tool.black]
extend-exclude = '''
^/pnq/__queries__.py|
^/pnq/actions.py
'''

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = [
  "tests",
]
